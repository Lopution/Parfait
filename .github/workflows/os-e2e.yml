name: OS E2E

# Real-process OS-level E2E driven by tool/dev_workbench/run_os_e2e.py:
# - Pull requests touching Android native code, plugins, dev_workbench, or
#   Dart platform-channel wrapper files run Android KVM AVD OS E2E smoke.
#   (PR Linux Xvfb OS E2E smoke runs inside linux.yml.)
# - Nightly schedule & manual dispatch run full Linux Xvfb and Android KVM AVD
#   OS E2E suites.

on:
  pull_request:
    paths:
      - 'android/**'
      - 'plugins/**'
      - 'tool/dev_workbench/**'
      - 'lib/core/platform/**'
      - 'lib/app/external_intent_bridge.dart'
      - 'lib/app/haptics/haptics_driver.dart'
      - 'lib/app/navigation/keyboard_back.dart'
      - 'lib/app/window/desktop_window*.dart'
      - 'lib/core/updater/update_*.dart'
      - 'lib/core/reverse_image/reverse_image_*.dart'
      - 'lib/core/profile/web_profile_*.dart'
      - 'lib/core/auth/account_transfer_service.dart'
      - 'lib/core/download/download_providers.dart'
      - '.github/workflows/os-e2e.yml'
  schedule:
    - cron: '30 19 * * *' # 03:30 CST daily
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - android_avd

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-os-e2e:
    name: Linux Xvfb OS E2E
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.platform == 'all' || inputs.platform == 'linux'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop & Xvfb dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            xvfb xdotool xclip
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: plugins/rhttp/rhttp/rust -> ../../../../build/linux/x64/debug/plugins/rhttp/cargokit_build
          shared-key: linux-debug
      - run: flutter pub get --enforce-lockfile
      - name: Build Linux dev harness
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_OPT_LEVEL: "0"
          CARGOKIT_VERBOSE: "1"
        run: flutter build linux --debug -t lib/main_dev.dart
      - name: Run full Linux Xvfb OS E2E
        run: python3 tool/dev_workbench/run_os_e2e.py --platform linux --json-out build/os-e2e-linux.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: os-e2e-linux-report
          path: build/os-e2e-linux.json
          if-no-files-found: ignore
          retention-days: 14

  android-os-e2e:
    name: Android KVM AVD OS E2E
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.platform == 'all' || inputs.platform == 'android_avd'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: plugins/rhttp/rhttp/rust -> ../../../../build/rhttp/build
          shared-key: android-debug
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: flutter pub get --enforce-lockfile
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android KVM AVD OS E2E
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            if [ "$IS_PR" = "true" ]; then
              python3 tool/dev_workbench/run_os_e2e.py --platform android_avd --smoke --json-out build/os-e2e-android.json
            else
              python3 tool/dev_workbench/run_os_e2e.py --platform android_avd --json-out build/os-e2e-android.json
            fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: os-e2e-android-report
          path: build/os-e2e-android.json
          if-no-files-found: ignore
          retention-days: 14
