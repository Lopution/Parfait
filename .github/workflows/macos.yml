name: macOS build

# Compile-only guard for the macOS port, like windows.yml: proves the
# Runner, the rhttp Apple toolchain and the plugin registration all link.
# Runtime acceptance (login, downloads, window restoration) stays a manual
# checklist on a Mac.
#
# Not a required check, so a workflow-level paths filter is safe: unrelated
# PRs never trigger it and no required check is left pending.
on:
  pull_request:
    paths:
      - 'macos/**'
      - 'plugins/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/macos.yml'
  schedule:
    # Nightly safety net on the default branch: a Dart-only change that
    # breaks the macOS compile surfaces here at the latest.
    - cron: '41 18 * * *'
  workflow_dispatch:

jobs:
  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true
      # cargokit builds the Rust client for the runner's architecture; the
      # repo toolchain pins the Android/Windows targets only.
      - run: rustup target add aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # cargokit builds into the plugin's build directory for the host.
          workspaces: plugins/rhttp/rhttp/rust -> ../../../../build/macos/Build/Products/Release/rhttp
      - run: flutter pub get --enforce-lockfile
      - run: flutter build macos --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parfait-macos
          path: build/macos/Build/Products/Release/Parfait.app
