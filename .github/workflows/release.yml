name: Release

# Manual only (D-4). Never triggered automatically; publishing a public
# formal release stays out of this workflow's scope — this only builds,
# signs, drafts and uploads assets for verification.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to publish (e.g. 1.0.0)"
        required: true
      versionCode:
        description: "Android versionCode integer"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
      - run: flutter pub get

      - name: Decode release keystore (never logged)
        env:
          PIXIV_RELEASE_KEYSTORE_B64: ${{ secrets.PIXIV_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$PIXIV_RELEASE_KEYSTORE_B64" || \
            { echo "::error::missing PIXIV_RELEASE_KEYSTORE_B64 secret"; exit 1; }
          mkdir -p ~/.pixivfunc-release && chmod 700 ~/.pixivfunc-release
          echo "$PIXIV_RELEASE_KEYSTORE_B64" | base64 -d > ~/.pixivfunc-release/pixivfunc-release.jks
          chmod 600 ~/.pixivfunc-release/pixivfunc-release.jks

      - name: Build signed APK (github flavor)
        env:
          PIXIV_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.PIXIV_RELEASE_KEYSTORE_PASSWORD }}
          PIXIV_RELEASE_KEY_ALIAS: ${{ secrets.PIXIV_RELEASE_KEY_ALIAS }}
          PIXIV_RELEASE_KEY_PASSWORD: ${{ secrets.PIXIV_RELEASE_KEY_PASSWORD }}
          PIXIV_UPDATE_PUBLIC_KEY_DER_B64: ${{ secrets.PIXIV_UPDATE_PUBLIC_KEY_DER_B64 }}
        run: |
          test -n "$PIXIV_RELEASE_KEYSTORE_PASSWORD" || { echo "::error::missing keystore password secret"; exit 1; }
          test -n "$PIXIV_RELEASE_KEY_ALIAS" || { echo "::error::missing key alias secret"; exit 1; }
          test -n "$PIXIV_RELEASE_KEY_PASSWORD" || { echo "::error::missing key password secret"; exit 1; }
          test -n "$PIXIV_UPDATE_PUBLIC_KEY_DER_B64" || { echo "::error::missing updater public key secret"; exit 1; }
          flutter build apk --release --flavor github \
            -PPIXIV_RELEASE_KEYSTORE="$HOME/.pixivfunc-release/pixivfunc-release.jks" \
            -PPIXIV_RELEASE_KEYSTORE_PASSWORD="$PIXIV_RELEASE_KEYSTORE_PASSWORD" \
            -PPIXIV_RELEASE_KEY_ALIAS="$PIXIV_RELEASE_KEY_ALIAS" \
            -PPIXIV_RELEASE_KEY_PASSWORD="$PIXIV_RELEASE_KEY_PASSWORD" \
            -PPIXIV_UPDATE_PUBLIC_KEY_DER_B64="$PIXIV_UPDATE_PUBLIC_KEY_DER_B64"

      - name: Verify signer cert and compute fingerprint
        run: |
          APK=build/app/outputs/flutter-apk/app-github-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)
          test -x "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          SIGNER=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | \
            grep -o 'SHA-256 digest: [0-9a-f]*' | awk '{print $3}' || true)
          if [ -z "$SIGNER" ]; then
            keytool -printcert -jarfile "$APK" 2>/dev/null | grep -o 'SHA256: [0-9A-Fa-f:]*' | head -1
            SIGNER=$(keytool -printcert -jarfile "$APK" 2>/dev/null | grep -o 'SHA256: [0-9A-Fa-f:]*' | head -1 | tr -d 'SHA256: :' | tr 'A-F' 'a-f')
          fi
          test -n "$SIGNER" || { echo "::error::could not read signer fingerprint"; exit 1; }
          if "$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | grep -q 'Android Debug'; then
            echo "::error::debug-signed APK cannot be released"
            exit 1
          fi
          echo "FINGERPRINT=$SIGNER" >> "$GITHUB_ENV"

      - name: Generate manifest + signature
        env:
          UPDATE_SIGNING_KEY_B64: ${{ secrets.UPDATE_SIGNING_KEY_B64 }}
        run: |
          test -n "$UPDATE_SIGNING_KEY_B64" || { echo "::error::missing UPDATE_SIGNING_KEY_B64 secret"; exit 1; }
          echo "$UPDATE_SIGNING_KEY_B64" | base64 -d > ~/.pixivfunc-release/update-signing-key.pem
          chmod 600 ~/.pixivfunc-release/update-signing-key.pem
          APK=build/app/outputs/flutter-apk/app-github-release.apk
          cp "$APK" "pixiv-func-v${{ github.event.inputs.version }}-github.apk"
          python3 tool/update_release.py generate \
            --apk "$APK" \
            --version "${{ github.event.inputs.version }}" \
            --version-code "${{ github.event.inputs.versionCode }}" \
            --asset-url "https://github.com/Lopution/Pixiv-func/releases/download/v${{ github.event.inputs.version }}/pixiv-func-v${{ github.event.inputs.version }}-github.apk" \
            --signing-cert-sha256 "$FINGERPRINT" \
            --key-file ~/.pixivfunc-release/update-signing-key.pem \
            --out-dir ./assets

      - name: Draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Draft only (L2): no public formal release is published here.
          gh release view "v${{ github.event.inputs.version }}" >/dev/null 2>&1 || \
            gh release create "v${{ github.event.inputs.version }}" \
              --title "v${{ github.event.inputs.version }}" \
              --draft \
              "pixiv-func-v${{ github.event.inputs.version }}-github.apk" \
              "assets/update-manifest.json" \
              "assets/update-manifest.sig"

      - name: Scan for leaked secrets (fail on match)
        run: |
          set -e
          if grep -rIl --exclude-dir=.git -E "PRIVATE KEY|BEGIN RSA|BEGIN EC PRIVATE" build/ assets/ . 2>/dev/null | grep -vE "tool/update_release.py|\.md$" | grep -q .; then
            echo "::error::private key material found in build output"
            exit 1
          fi
