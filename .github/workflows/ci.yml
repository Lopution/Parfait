name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Path gate for the heavy build jobs: docs-only changes (.trellis, *.md)
    # skip compilation entirely. analyze-and-test stays unconditional on PRs
    # because the ruleset requires it — a workflow-level paths-ignore would
    # leave the required check pending forever and block merges.
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
      android: ${{ steps.filter.outputs.android }}
      plugin: ${{ steps.filter.outputs.plugin }}
      deps: ${{ steps.filter.outputs.deps }}
      icons: ${{ steps.filter.outputs.icons }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Fail-open design: enumerate paths that can affect artifacts, not
          # paths to ignore. Anything unlisted (docs, .trellis, licenses)
          # skips the build jobs.
          filters: |
            build:
              - 'lib/**'
              - 'android/**'
              - 'linux/**'
              - 'ios/**'
              - 'macos/**'
              - 'web/**'
              - 'assets/**'
              - 'plugins/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'l10n.yaml'
              - 'rust-toolchain.toml'
              - 'tool/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            # PR gate for the APK build and the Kotlin tests: everything that
            # changes the Android side except Dart code. A Dart-only PR skips
            # them; the push to main still builds and size-checks every merge
            # (android-release runs on `build` there).
            android:
              - 'android/**'
              - 'plugins/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'rust-toolchain.toml'
              - 'tool/apk_size_report.py'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            plugin:
              - 'plugins/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            deps:
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'plugins/**/pubspec.yaml'
              - 'plugins/**/pubspec.lock'
              - 'plugins/**/Cargo.toml'
              - 'plugins/**/Cargo.lock'
              - 'rust-toolchain.toml'
            icons:
              - 'tool/icons/**'
              - 'tool/build_icons.py'
              - 'tool/requirements-icons.txt'
              - 'assets/icon.ttf'
              - 'lib/app/icons/app_icons.dart'

  analyze:
    # Skipped on push to main: the ruleset requires strict up-to-date status
    # checks, so every merge to main was already analyzed on the exact tree.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The budget measures the change from HEAD^1: a pull request's
          # merge commit's first parent is the base it was merged onto (a
          # base branch fetched later may have moved), and on dev it is
          # the commit before the merge.
          fetch-depth: 2
      - run: python3 tool/check_spec.py --self-test
      - run: python3 tool/check_spec.py
      - run: python3 tool/dev_workbench/verify_catalog.py
      - run: >-
          python3 -m unittest
          tool/dev_workbench/test_assertions.py
          tool/dev_workbench/test_catalog_matrix.py
          tool/dev_workbench/test_server.py
      - run: python3 tool/affected_tests.py --self-test
      - run: python3 tool/apk_size_report.py --self-test
      - name: Test budget (spec TEST-05)
        run: python3 tool/test_budget.py --base HEAD^1 --summary "$GITHUB_STEP_SUMMARY"
      - name: PR size watermark
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import os, subprocess

          out = subprocess.run(
              ["git", "diff", "--numstat", "HEAD^1..HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          files = len(out)
          added = deleted = 0
          for line in out:
              parts = line.split("\t")
              if len(parts) >= 2 and parts[0].isdigit() and parts[1].isdigit():
                  added += int(parts[0])
                  deleted += int(parts[1])
          net = added - deleted
          msg = f"PR size: {files} files, +{added}/-{deleted} (net {net:+d} lines)"
          print(msg)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(f"\n{msg}\n")
          if files > 80 or abs(net) > 4000:
              print(
                  f"::warning::{msg} exceeds soft watermark (80 files / 4,000 net lines); "
                  "consider landing dev milestones more frequently or splitting stages"
              )
          PY
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python3 tool/gen_l10n_lookup.py --check
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze

  icons-check:
    needs: changes
    if: >-
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev') &&
      needs.changes.outputs.icons == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify generated icon font and AppIcons
        run: |
          python3 -m venv "$RUNNER_TEMP/icons-venv"
          "$RUNNER_TEMP/icons-venv/bin/pip" install --no-cache-dir -r tool/requirements-icons.txt
          "$RUNNER_TEMP/icons-venv/bin/python" tool/build_icons.py --check

  workflows-and-secrets:
    # actionlint checks the workflow files (and, through the runner's
    # shellcheck, their run scripts); gitleaks scans the commits a pull
    # request or a dev push adds. Both are release binaries pinned by version
    # and checksum, which Dependabot does not bump: update them by hand.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD^1..HEAD (or before..HEAD on dev) reaches every added commit.
          fetch-depth: 0
      - name: Install actionlint and gitleaks
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -sSfLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" actionlint.tar.gz "$GITLEAKS_SHA256" gitleaks.tar.gz | sha256sum -c -
          tar -xzf actionlint.tar.gz -C "$bin" actionlint
          tar -xzf gitleaks.tar.gz -C "$bin" gitleaks
          echo "$bin" >> "$GITHUB_PATH"
      - run: actionlint
      - name: Scan the added commits for secrets
        # On a pull request HEAD is its merge commit and HEAD^1 the base;
        # on dev, before..HEAD covers all pushed commits (falling back to
        # HEAD^1..HEAD on branch creation). Known false positives in older
        # history are listed in .gitleaksignore.
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range="HEAD^1..HEAD"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] &&
            [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
            git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="${BEFORE_SHA}..HEAD"
          fi
          gitleaks git --no-banner --redact --log-opts="$range" .

  test:
    name: test (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    # Full sharded suite runs on pull requests; push to main is already
    # covered by the strict PR ruleset, and push to dev runs test-dev below.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      # Let all shards finish so one failure does not hide the others'.
      fail-fast: false
      matrix:
        # Each shard runs whole test files (tool/test_shards.py), so it
        # compiles only its own; --total-shards would split cases inside
        # every file and make each shard compile the whole suite.
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pick this shard's test files
        run: |
          python3 tool/test_shards.py --shards ${{ strategy.job-total }} \
            --exclude-tag matrix --check
          python3 tool/test_shards.py --shards ${{ strategy.job-total }} \
            --exclude-tag matrix --index ${{ matrix.shard }} \
            > "$RUNNER_TEMP/shard-files.txt"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Run this shard's test files
        run: |
          mapfile -t files < "$RUNNER_TEMP/shard-files.txt"
          # No files would make flutter test run the whole tree.
          test "${#files[@]}" -gt 0 || { echo "::error::empty shard"; exit 1; }
          flutter test -x matrix "${files[@]}"

  test-dev:
    # Fast single-runner integration check for pushes to dev: runs
    # architecture scans + affected non-locale_layout tests. The full
    # sharded suite (including locale_layout) runs on the dev -> main PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select affected tests for dev push
        id: select
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="HEAD^1"
          if [ -n "$BEFORE_SHA" ] &&
            [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
            git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            base="$BEFORE_SHA"
          fi
          git diff --name-only "${base}..HEAD" > "$RUNNER_TEMP/changed.txt"
          python3 tool/affected_tests.py \
            --changed-list "$RUNNER_TEMP/changed.txt" \
            --include-architecture \
            --json > "$RUNNER_TEMP/affected.json"
          python3 - "$RUNNER_TEMP/affected.json" "$RUNNER_TEMP/dev-tests.txt" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          out_files = pathlib.Path(sys.argv[2])
          gh_out = pathlib.Path(sys.argv[3])
          if data["mode"] == "skip_dart":
              out_files.write_text("")
              with gh_out.open("a") as fh:
                  fh.write("run=false\n")
              print("No Dart/asset changes in dev push; skipping flutter test.")
              sys.exit(0)
          if data["mode"] == "whole_suite":
              # Global config changed on dev: keep dev fast with architecture
              # scans; full suite runs on the dev -> main PR.
              tests = sorted(
                  p.as_posix()
                  for p in pathlib.Path("test/architecture").glob("*_test.dart")
              )
              print(f"Whole-suite trigger ({data['reason']}); running {len(tests)} architecture tests on dev.")
          else:
              tests = [t for t in data["tests"] if not t.startswith("test/locale_layout/")]
              if len(tests) > 45:
                  arch = [t for t in tests if t.startswith("test/architecture/")]
                  rest = [t for t in tests if not t.startswith("test/architecture/")][:30]
                  tests = sorted(set(arch + rest))
                  print(f"Capped dev fast pass to {len(tests)} files; full suite runs on dev -> main PR.")
          out_files.write_text("\n".join(tests) + ("\n" if tests else ""))
          with gh_out.open("a") as fh:
              fh.write(f"run={'true' if tests else 'false'}\n")
          print(f"Selected {len(tests)} test files for dev push.")
          PY
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.select.outputs.run == 'true'
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true
      - if: steps.select.outputs.run == 'true'
        run: flutter pub get --enforce-lockfile
      - name: Run selected dev tests
        if: steps.select.outputs.run == 'true'
        run: |
          mapfile -t files < "$RUNNER_TEMP/dev-tests.txt"
          flutter test "${files[@]}"

  analyze-and-test:
    # The single check the ruleset requires. It aggregates analyze, every
    # test shard and the workflow and secret scans, so keep the name and
    # let it run even when they fail: a skipped required check would count
    # as passing.
    needs: [changes, analyze, test, workflows-and-secrets, icons-check]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require analyze, all test shards and the scans to succeed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SCAN_RESULT: ${{ needs.workflows-and-secrets.result }}
          ICONS_RESULT: ${{ needs.icons-check.result }}
        run: |
          echo "changes: $CHANGES_RESULT"
          echo "analyze: $ANALYZE_RESULT"
          echo "test:    $TEST_RESULT"
          echo "scans:   $SCAN_RESULT"
          echo "icons:   $ICONS_RESULT"
          if [ "$CHANGES_RESULT" != success ] ||
            [ "$ANALYZE_RESULT" != success ] || [ "$TEST_RESULT" != success ] ||
            [ "$SCAN_RESULT" != success ] ||
            { [ "$ICONS_RESULT" != success ] && [ "$ICONS_RESULT" != skipped ]; }; then
            echo "::error::changes, analyze, a test shard, icons-check or a scan did not succeed"
            exit 1
          fi

  android-release:
    # Release-side safety (REL-13): the release workflow must never publish a
    # debug-signed APK, so the release-signing check runs on every
    # build-affecting push to main and on PRs from this repository when
    # Android files change. PRs from forks cannot read secrets; android-size
    # covers them on PR, and push to main still signs and size-checks after
    # merge.
    needs: changes
    if: >-
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.build == 'true') ||
      (github.event_name == 'pull_request' &&
      needs.changes.outputs.android == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # cargokit builds into the rhttp Gradle project's buildDir/build
          # (cargo --target-dir), not rust/target.
          workspaces: plugins/rhttp/rhttp/rust -> ../../../../build/rhttp/build
          shared-key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: flutter pub get --enforce-lockfile
      - name: Decode release keystore
        env:
          PIXIV_RELEASE_KEYSTORE_B64: ${{ secrets.PIXIV_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$PIXIV_RELEASE_KEYSTORE_B64" || \
            { echo "::error::PIXIV_RELEASE_KEYSTORE_B64 secret is missing; a debug-signed release must never be published"; exit 1; }
          mkdir -p ~/.pixivfunc-release && chmod 700 ~/.pixivfunc-release
          echo "$PIXIV_RELEASE_KEYSTORE_B64" | base64 -d > ~/.pixivfunc-release/pixivfunc-release.jks
          chmod 600 ~/.pixivfunc-release/pixivfunc-release.jks

      - name: Build github release (official signing required)
        env:
          PIXIV_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.PIXIV_RELEASE_KEYSTORE_PASSWORD }}
          PIXIV_RELEASE_KEY_ALIAS: ${{ secrets.PIXIV_RELEASE_KEY_ALIAS }}
          PIXIV_RELEASE_KEY_PASSWORD: ${{ secrets.PIXIV_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$PIXIV_RELEASE_KEYSTORE_PASSWORD" || { echo "::error::missing keystore password secret"; exit 1; }
          test -n "$PIXIV_RELEASE_KEY_ALIAS" || { echo "::error::missing key alias secret"; exit 1; }
          test -n "$PIXIV_RELEASE_KEY_PASSWORD" || { echo "::error::missing key password secret"; exit 1; }
          flutter build apk --release --flavor github \
            --split-per-abi --target-platform android-arm64,android-arm \
            --split-debug-info=build/symbols/github \
            -PPIXIV_RELEASE_KEYSTORE="$HOME/.pixivfunc-release/pixivfunc-release.jks" \
            -PPIXIV_RELEASE_KEYSTORE_PASSWORD="$PIXIV_RELEASE_KEYSTORE_PASSWORD" \
            -PPIXIV_RELEASE_KEY_ALIAS="$PIXIV_RELEASE_KEY_ALIAS" \
            -PPIXIV_RELEASE_KEY_PASSWORD="$PIXIV_RELEASE_KEY_PASSWORD"

      - name: Verify split APK signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)
          test -x "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          for APK in \
            build/app/outputs/flutter-apk/app-arm64-v8a-github-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-github-release.apk
          do
            test -s "$APK" || { echo "::error::missing $APK"; exit 1; }
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            if "$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | grep -q 'Android Debug'; then
              echo "::error::debug-signed APK cannot pass: $APK"
              exit 1
            fi
          done

      - name: Report split APK sizes
        # Defaults = measured github split bytes + 1_000_000 headroom,
        # re-baselined 2026-11-25 (arm64 15,879,728; armeabi-v7a 15,275,442).
        # fdroid runs ~12 KB under.
        # Repo vars override; the arm64 32_000_000 hard cap still
        # applies (stricter wins).
        env:
          PIXIV_APK_MAX_BYTES_ARM64_V8A: ${{ vars.PIXIV_APK_MAX_BYTES_ARM64_V8A || '16879728' }}
          PIXIV_APK_MAX_BYTES_ARMEABI_V7A: ${{ vars.PIXIV_APK_MAX_BYTES_ARMEABI_V7A || '16275442' }}
        run: |
          python3 tool/apk_size_report.py \
            build/app/outputs/flutter-apk/app-arm64-v8a-github-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-github-release.apk

      - name: Analyze arm64 code size
        # Non-blocking archive; Flutter refuses --analyze-size on multi-ABI
        # builds, so this is a separate single-ABI build (not a release
        # artifact). Archive only from main: on PRs it would repeat a ~2 min
        # build nobody reads.
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          PIXIV_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.PIXIV_RELEASE_KEYSTORE_PASSWORD }}
          PIXIV_RELEASE_KEY_ALIAS: ${{ secrets.PIXIV_RELEASE_KEY_ALIAS }}
          PIXIV_RELEASE_KEY_PASSWORD: ${{ secrets.PIXIV_RELEASE_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor github \
            --target-platform android-arm64 \
            --analyze-size --code-size-directory=build/analyze-size/github \
            -PPIXIV_RELEASE_KEYSTORE="$HOME/.pixivfunc-release/pixivfunc-release.jks" \
            -PPIXIV_RELEASE_KEYSTORE_PASSWORD="$PIXIV_RELEASE_KEYSTORE_PASSWORD" \
            -PPIXIV_RELEASE_KEY_ALIAS="$PIXIV_RELEASE_KEY_ALIAS" \
            -PPIXIV_RELEASE_KEY_PASSWORD="$PIXIV_RELEASE_KEY_PASSWORD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        continue-on-error: true
        with:
          name: github-analyze-size
          path: build/analyze-size/github

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-symbols
          path: build/symbols/github

  android-size:
    # Secrets-free size gate, only for PRs from forks: they cannot read the
    # keystore secrets, so android-release would fail there. Everywhere else
    # android-release runs the same per-ABI size report. The fdroid flavor
    # differs from github only in flavor config and its own source set
    # (unit-tested in android-unit), and runs ~12 KB under github.
    needs: changes
    if: >-
      needs.changes.outputs.android == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # cargokit builds into the rhttp Gradle project's buildDir/build
          # (cargo --target-dir), not rust/target.
          workspaces: plugins/rhttp/rhttp/rust -> ../../../../build/rhttp/build
          shared-key: android
          save-if: "false"
      - run: flutter pub get --enforce-lockfile
      - name: Build fdroid split release
        run: |
          flutter build apk --release --flavor fdroid \
            --split-per-abi --target-platform android-arm64,android-arm \
            --split-debug-info=build/symbols/fdroid
      - name: Report split APK sizes
        # Defaults = measured github split bytes + 1_000_000 headroom,
        # re-baselined 2026-11-25 (arm64 15,879,728; armeabi-v7a 15,275,442).
        # fdroid runs ~12 KB under.
        # Repo vars override; the arm64 32_000_000 hard cap still
        # applies (stricter wins).
        env:
          PIXIV_APK_MAX_BYTES_ARM64_V8A: ${{ vars.PIXIV_APK_MAX_BYTES_ARM64_V8A || '16879728' }}
          PIXIV_APK_MAX_BYTES_ARMEABI_V7A: ${{ vars.PIXIV_APK_MAX_BYTES_ARMEABI_V7A || '16275442' }}
        run: |
          python3 tool/apk_size_report.py \
            build/app/outputs/flutter-apk/app-arm64-v8a-fdroid-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-fdroid-release.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdroid-split-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-fdroid-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-fdroid-release.apk
          retention-days: 14

  plugin:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true
      - run: rustup toolchain install
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: plugins/rhttp/rhttp/rust
      - run: flutter pub get --enforce-lockfile
        working-directory: plugins/rhttp/rhttp
      - run: flutter test
        working-directory: plugins/rhttp/rhttp
      - run: tool/frb_check.sh
      - run: cargo fmt --check
        working-directory: plugins/rhttp/rhttp/rust
      - run: cargo test --locked
        working-directory: plugins/rhttp/rhttp/rust

  android-unit:
    # Kotlin JVM tests only: skip Flutter's Dart/asset compilation tasks so
    # this job tests Android native code without compiling lib/ twice.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --config-only --flavor fdroid
      - run: >-
          ./gradlew --no-daemon
          -x compileFlutterBuildGithubDebug
          -x copyFlutterAssetsGithubDebug
          -x compileFlutterBuildFdroidDebug
          -x copyFlutterAssetsFdroidDebug
          :app:testGithubDebugUnitTest :app:testFdroidDebugUnitTest
        working-directory: android

  deps-report:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true
      - run: rustup toolchain install
      - name: Collect dependency reports
        run: |
          mkdir -p deps-report
          flutter pub outdated > deps-report/root-pub-outdated.txt 2>&1 || true
          (cd plugins/rhttp/rhttp && flutter pub outdated) > deps-report/plugin-pub-outdated.txt 2>&1 || true
          (cd plugins/rhttp/rhttp/rust && cargo update --dry-run) > deps-report/cargo-update-dry-run.txt 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deps-report
          path: deps-report/
          retention-days: 30
