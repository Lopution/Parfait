name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    # Path gate for the heavy build jobs: docs-only changes (.trellis, *.md)
    # skip compilation entirely. analyze-and-test stays unconditional because
    # the ruleset requires it — a workflow-level paths-ignore would leave the
    # required check pending forever and block merges.
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
      android: ${{ steps.filter.outputs.android }}
      plugin: ${{ steps.filter.outputs.plugin }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Fail-open design: enumerate paths that can affect artifacts, not
          # paths to ignore. Anything unlisted (docs, .trellis, licenses)
          # skips the build jobs.
          filters: |
            build:
              - 'lib/**'
              - 'android/**'
              - 'linux/**'
              - 'ios/**'
              - 'macos/**'
              - 'web/**'
              - 'assets/**'
              - 'plugins/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'l10n.yaml'
              - 'rust-toolchain.toml'
              - 'tool/**'
              - '.github/workflows/**'
            # PR gate for the APK build and the Kotlin tests: everything that
            # changes the Android side except Dart code. A Dart-only PR skips
            # them; the push to main still builds and size-checks every merge
            # (android-release runs on `build` there).
            android:
              - 'android/**'
              - 'plugins/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'rust-toolchain.toml'
              - 'tool/apk_size_report.py'
              - '.github/workflows/**'
            plugin:
              - 'plugins/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            deps:
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'plugins/**/pubspec.yaml'
              - 'plugins/**/pubspec.lock'
              - 'plugins/**/Cargo.toml'
              - 'plugins/**/Cargo.lock'
              - 'rust-toolchain.toml'

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 tool/check_spec.py --self-test
      - run: python3 tool/check_spec.py
      - name: Test budget (spec TEST-05)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_REF"
          python3 tool/test_budget.py --base FETCH_HEAD --summary "$GITHUB_STEP_SUMMARY"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze

  test:
    name: test (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      # Let all shards finish so one failure does not hide the others'.
      fail-fast: false
      matrix:
        # Each shard runs whole test files (tool/test_shards.py), so it
        # compiles only its own; --total-shards would split cases inside
        # every file and make each shard compile the whole suite.
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
      - name: Pick this shard's test files
        run: |
          python3 tool/test_shards.py --shards ${{ strategy.job-total }} --check
          python3 tool/test_shards.py --shards ${{ strategy.job-total }} \
            --index ${{ matrix.shard }} > "$RUNNER_TEMP/shard-files.txt"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Run this shard's test files
        run: |
          mapfile -t files < "$RUNNER_TEMP/shard-files.txt"
          # No files would make flutter test run the whole tree.
          test "${#files[@]}" -gt 0 || { echo "::error::empty shard"; exit 1; }
          flutter test "${files[@]}"

  analyze-and-test:
    # The single check the ruleset requires. It aggregates analyze and every
    # test shard, so keep the name and let it run even when they fail:
    # a skipped required check would count as passing.
    needs: [analyze, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require analyze and all test shards to succeed
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "analyze: $ANALYZE_RESULT"
          echo "test:    $TEST_RESULT"
          if [ "$ANALYZE_RESULT" != success ] || [ "$TEST_RESULT" != success ]; then
            echo "::error::analyze or a test shard did not succeed"
            exit 1
          fi

  android-release:
    # Release-side safety: the release workflow must never publish a debug
    # signed APK, so the release-signing check runs on main and on PRs from
    # this repository. PRs from forks cannot read secrets; android-size
    # covers them. PRs run it only for Android-side changes; on main every
    # build-affecting merge runs it, which is the size backstop for
    # Dart-only PRs.
    needs: changes
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.build == 'true') ||
      (github.event_name == 'pull_request' &&
      needs.changes.outputs.android == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # cargokit builds into the rhttp Gradle project's buildDir/build
          # (cargo --target-dir), not rust/target.
          workspaces: plugins/rhttp/rhttp/rust -> ../../../../build/rhttp/build
          shared-key: android
      - run: flutter pub get --enforce-lockfile
      - name: Decode release keystore
        env:
          PIXIV_RELEASE_KEYSTORE_B64: ${{ secrets.PIXIV_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$PIXIV_RELEASE_KEYSTORE_B64" || \
            { echo "::error::PIXIV_RELEASE_KEYSTORE_B64 secret is missing; a debug-signed release must never be published"; exit 1; }
          mkdir -p ~/.pixivfunc-release && chmod 700 ~/.pixivfunc-release
          echo "$PIXIV_RELEASE_KEYSTORE_B64" | base64 -d > ~/.pixivfunc-release/pixivfunc-release.jks
          chmod 600 ~/.pixivfunc-release/pixivfunc-release.jks

      - name: Build github release (official signing required)
        env:
          PIXIV_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.PIXIV_RELEASE_KEYSTORE_PASSWORD }}
          PIXIV_RELEASE_KEY_ALIAS: ${{ secrets.PIXIV_RELEASE_KEY_ALIAS }}
          PIXIV_RELEASE_KEY_PASSWORD: ${{ secrets.PIXIV_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$PIXIV_RELEASE_KEYSTORE_PASSWORD" || { echo "::error::missing keystore password secret"; exit 1; }
          test -n "$PIXIV_RELEASE_KEY_ALIAS" || { echo "::error::missing key alias secret"; exit 1; }
          test -n "$PIXIV_RELEASE_KEY_PASSWORD" || { echo "::error::missing key password secret"; exit 1; }
          flutter build apk --release --flavor github \
            --split-per-abi --target-platform android-arm64,android-arm \
            --obfuscate --split-debug-info=build/symbols/github \
            -PPIXIV_RELEASE_KEYSTORE="$HOME/.pixivfunc-release/pixivfunc-release.jks" \
            -PPIXIV_RELEASE_KEYSTORE_PASSWORD="$PIXIV_RELEASE_KEYSTORE_PASSWORD" \
            -PPIXIV_RELEASE_KEY_ALIAS="$PIXIV_RELEASE_KEY_ALIAS" \
            -PPIXIV_RELEASE_KEY_PASSWORD="$PIXIV_RELEASE_KEY_PASSWORD"

      - name: Verify split APK signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)
          test -x "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          for APK in \
            build/app/outputs/flutter-apk/app-arm64-v8a-github-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-github-release.apk
          do
            test -s "$APK" || { echo "::error::missing $APK"; exit 1; }
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            if "$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | grep -q 'Android Debug'; then
              echo "::error::debug-signed APK cannot pass: $APK"
              exit 1
            fi
          done

      - name: Report split APK sizes
        # Defaults = measured github split bytes + 1_000_000 headroom.
        # armeabi-v7a re-baselined 2026-09-23 (25,895,753) — W4 viewer/
        # series-flow AOT growth exhausted the 09-16 margin; arm64 stays
        # on the 28,985,336 baseline. fdroid runs ~12 KB under.
        # Repo vars override; the arm64 32_000_000 hard cap still
        # applies (stricter wins).
        env:
          PIXIV_APK_MAX_BYTES_ARM64_V8A: ${{ vars.PIXIV_APK_MAX_BYTES_ARM64_V8A || '31042311' }}
          PIXIV_APK_MAX_BYTES_ARMEABI_V7A: ${{ vars.PIXIV_APK_MAX_BYTES_ARMEABI_V7A || '26895753' }}
        run: |
          python3 tool/apk_size_report.py \
            build/app/outputs/flutter-apk/app-arm64-v8a-github-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-github-release.apk

      - name: Analyze arm64 code size
        # Non-blocking archive; Flutter refuses --analyze-size on multi-ABI
        # builds, so this is a separate single-ABI build (not a release
        # artifact). Archive only from main: on PRs it would repeat a ~2 min
        # build nobody reads.
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          PIXIV_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.PIXIV_RELEASE_KEYSTORE_PASSWORD }}
          PIXIV_RELEASE_KEY_ALIAS: ${{ secrets.PIXIV_RELEASE_KEY_ALIAS }}
          PIXIV_RELEASE_KEY_PASSWORD: ${{ secrets.PIXIV_RELEASE_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor github \
            --target-platform android-arm64 \
            --analyze-size --code-size-directory=build/analyze-size/github \
            -PPIXIV_RELEASE_KEYSTORE="$HOME/.pixivfunc-release/pixivfunc-release.jks" \
            -PPIXIV_RELEASE_KEYSTORE_PASSWORD="$PIXIV_RELEASE_KEYSTORE_PASSWORD" \
            -PPIXIV_RELEASE_KEY_ALIAS="$PIXIV_RELEASE_KEY_ALIAS" \
            -PPIXIV_RELEASE_KEY_PASSWORD="$PIXIV_RELEASE_KEY_PASSWORD"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        continue-on-error: true
        with:
          name: github-analyze-size
          path: build/analyze-size/github

      - uses: actions/upload-artifact@v7
        with:
          name: github-release-symbols
          path: build/symbols/github

  android-size:
    # Secrets-free size gate, only for PRs from forks: they cannot read the
    # keystore secrets, so android-release would fail there. Everywhere else
    # android-release runs the same per-ABI size report. The fdroid flavor
    # differs from github only in flavor config and its own source set
    # (unit-tested in android-unit), and runs ~12 KB under github.
    needs: changes
    if: >-
      needs.changes.outputs.android == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # cargokit builds into the rhttp Gradle project's buildDir/build
          # (cargo --target-dir), not rust/target.
          workspaces: plugins/rhttp/rhttp/rust -> ../../../../build/rhttp/build
          shared-key: android
      - run: flutter pub get --enforce-lockfile
      - name: Build fdroid split release
        run: |
          flutter build apk --release --flavor fdroid \
            --split-per-abi --target-platform android-arm64,android-arm \
            --obfuscate --split-debug-info=build/symbols/fdroid
      - name: Report split APK sizes
        # Defaults = measured github split bytes + 1_000_000 headroom.
        # armeabi-v7a re-baselined 2026-09-23 (25,895,753) — W4 viewer/
        # series-flow AOT growth exhausted the 09-16 margin; arm64 stays
        # on the 28,985,336 baseline. fdroid runs ~12 KB under.
        # Repo vars override; the arm64 32_000_000 hard cap still
        # applies (stricter wins).
        env:
          PIXIV_APK_MAX_BYTES_ARM64_V8A: ${{ vars.PIXIV_APK_MAX_BYTES_ARM64_V8A || '31042311' }}
          PIXIV_APK_MAX_BYTES_ARMEABI_V7A: ${{ vars.PIXIV_APK_MAX_BYTES_ARMEABI_V7A || '26895753' }}
        run: |
          python3 tool/apk_size_report.py \
            build/app/outputs/flutter-apk/app-arm64-v8a-fdroid-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-fdroid-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: fdroid-split-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-fdroid-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-fdroid-release.apk
          retention-days: 14

  plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true
      - run: rustup toolchain install
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rhttp/rhttp/rust
      - run: flutter pub get --enforce-lockfile
        working-directory: plugins/rhttp/rhttp
      - run: flutter test
        working-directory: plugins/rhttp/rhttp
      - run: tool/frb_check.sh
      - run: cargo fmt --check
        working-directory: plugins/rhttp/rhttp/rust
      - run: cargo test --locked
        working-directory: plugins/rhttp/rhttp/rust

  android-unit:
    # Kotlin JVM tests only: no Dart code is compiled, so Dart changes
    # cannot affect them.
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --config-only --flavor fdroid
      - run: ./gradlew --no-daemon :app:testGithubDebugUnitTest :app:testFdroidDebugUnitTest
        working-directory: android

  deps-report:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true
      - run: rustup toolchain install
      - name: Collect dependency reports
        run: |
          mkdir -p deps-report
          flutter pub outdated > deps-report/root-pub-outdated.txt 2>&1 || true
          (cd plugins/rhttp/rhttp && flutter pub outdated) > deps-report/plugin-pub-outdated.txt 2>&1 || true
          (cd plugins/rhttp/rhttp/rust && cargo update --dry-run) > deps-report/cargo-update-dry-run.txt 2>&1
      - uses: actions/upload-artifact@v7
        with:
          name: deps-report
          path: deps-report/
          retention-days: 30
