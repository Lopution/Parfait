name: Apple build

# Unified compile-only guard for macOS and iOS: runs on a single macos-latest
# runner so PRs do not contend for two macOS VMs and hit queue timeouts.
# PRs run fast --debug guards for touched targets; nightly schedule warms both
# debug/release caches and uploads unsigned/macOS release bundles.
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'macos/**'
      - 'plugins/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/apple.yml'
  schedule:
    # Nightly safety net on the default branch: warms the debug rust-cache for
    # PRs and verifies full --release AOT builds for macOS and iOS.
    - cron: '41 18 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Apple target platform'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - ios
      profile:
        description: 'Build profile'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apple-build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: >-
          ${{
            github.event_name == 'schedule' && fromJSON('["debug", "release"]') ||
            github.event_name == 'pull_request' && fromJSON('["debug"]') ||
            inputs.profile == 'debug' && fromJSON('["debug"]') ||
            fromJSON('["release"]')
          }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Select Apple targets
        id: targets
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          build_macos=false
          build_ios=false
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            while IFS= read -r file; do
              case "$file" in
                macos/*) build_macos=true ;;
                ios/*) build_ios=true ;;
                plugins/*|pubspec.yaml|pubspec.lock|rust-toolchain.toml|.github/workflows/apple.yml)
                  build_macos=true
                  build_ios=true
                  ;;
              esac
            done < <(git diff --name-only HEAD^1..HEAD)
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${INPUT_PLATFORM}" in
              macos) build_macos=true ;;
              ios) build_ios=true ;;
              *) build_macos=true; build_ios=true ;;
            esac
          else
            build_macos=true
            build_ios=true
          fi
          echo "build_macos=${build_macos}" >> "$GITHUB_OUTPUT"
          echo "build_ios=${build_ios}" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true

      # cargokit builds the Rust client for Apple architectures; the repo
      # toolchain pins Android/Windows targets only.
      - run: rustup target add aarch64-apple-darwin aarch64-apple-ios

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.profile == 'debug'
        with:
          workspaces: |
            plugins/rhttp/rhttp/rust -> ../../../../build/macos/Build/Intermediates.noindex/Pods.build/Debug/rhttp.build
            plugins/rhttp/rhttp/rust -> ../../../../build/ios/Intermediates.noindex/Pods.build/Debug-iphoneos/rhttp.build
          shared-key: apple-debug

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.profile == 'release'
        with:
          workspaces: |
            plugins/rhttp/rhttp/rust -> ../../../../build/macos/Build/Intermediates.noindex/Pods.build/Release/rhttp.build
            plugins/rhttp/rhttp/rust -> ../../../../build/ios/Intermediates.noindex/Pods.build/Release-iphoneos/rhttp.build
          shared-key: apple-release

      - run: flutter pub get --enforce-lockfile

      - name: Build macOS (debug)
        if: steps.targets.outputs.build_macos == 'true' && matrix.profile == 'debug'
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_OPT_LEVEL: "0"
          CARGOKIT_VERBOSE: "1"
        run: flutter build macos --debug --no-pub

      - name: Build macOS (release)
        if: steps.targets.outputs.build_macos == 'true' && matrix.profile == 'release'
        env:
          CARGOKIT_VERBOSE: "1"
        run: flutter build macos --release --no-pub

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.targets.outputs.build_macos == 'true' && matrix.profile == 'release' && github.event_name != 'pull_request'
        with:
          name: parfait-macos
          path: build/macos/Build/Products/Release/Parfait.app

      - name: Build iOS (debug, unsigned)
        if: steps.targets.outputs.build_ios == 'true' && matrix.profile == 'debug'
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_OPT_LEVEL: "0"
          CARGOKIT_VERBOSE: "1"
        run: flutter build ios --debug --no-codesign --no-pub

      - name: Build iOS (release, unsigned)
        if: steps.targets.outputs.build_ios == 'true' && matrix.profile == 'release'
        env:
          CARGOKIT_VERBOSE: "1"
        run: flutter build ios --release --no-codesign --no-pub

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.targets.outputs.build_ios == 'true' && matrix.profile == 'release' && github.event_name != 'pull_request'
        with:
          name: parfait-ios-unsigned
          path: build/ios/iphoneos/Runner.app
