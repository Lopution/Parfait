name: Windows build

# Compile-only guard for the desktop port: proves the Windows runner, the
# rhttp MSVC toolchain and the InAppWebView/WebView2 integration all link.
# Runtime acceptance (login, real data) stays a manual checklist.
#
# It is not a required check, so a workflow-level paths filter is safe:
# unrelated PRs never trigger it and no required check is left pending.
# Only this workflow file is listed among the workflows: the build reads
# nothing from ci.yml or release.yml.
on:
  pull_request:
    paths:
      - 'windows/**'
      - 'plugins/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/windows.yml'
  schedule:
    # Nightly safety net on the default branch: the rare Dart-only change that
    # breaks the Windows compile (conditional imports, plugin registration)
    # surfaces here at the latest.
    - cron: '23 18 * * *'
  # Manual run on any branch (pre-release check, image-pipeline stages):
  # gh workflow run windows.yml --ref <branch>
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          channel: "stable"
          cache: true
      # The repo's rust-toolchain.toml already carries the MSVC target;
      # windows-latest ships rustup with the toolchain auto-installed.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # cargokit.cmake builds into <plugin build dir>/cargokit_build.
          workspaces: plugins/rhttp/rhttp/rust -> ../../../../build/windows/x64/plugins/rhttp/cargokit_build
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parfait-windows-x64
          path: build/windows/x64/runner/Release
