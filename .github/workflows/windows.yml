name: Windows build

# Compile-only guard for the desktop port: proves the Windows runner, the
# rhttp MSVC toolchain and the InAppWebView/WebView2 integration all link.
# PRs run a fast --debug guard; nightly schedule warms debug/release caches
# and workflow_dispatch builds --release by default.
on:
  pull_request:
    paths:
      - 'windows/**'
      - 'plugins/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/windows.yml'
  schedule:
    # Nightly safety net on the default branch: warms the debug rust-cache for
    # PRs and verifies full --release AOT builds.
    - cron: '23 18 * * *'
  # Manual run on any branch (pre-release check, image-pipeline stages):
  # gh workflow run windows.yml --ref <branch>
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: >-
          ${{
            github.event_name == 'schedule' && fromJSON('["debug", "release"]') ||
            github.event_name == 'pull_request' && fromJSON('["debug"]') ||
            inputs.profile == 'debug' && fromJSON('["debug"]') ||
            fromJSON('["release"]')
          }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true
      # The repo's rust-toolchain.toml already carries the MSVC target;
      # windows-latest ships rustup with the toolchain auto-installed.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # cargokit.cmake builds into <plugin build dir>/cargokit_build.
          workspaces: plugins/rhttp/rhttp/rust -> ../../../../build/windows/x64/plugins/rhttp/cargokit_build
          shared-key: windows-${{ matrix.profile }}
      - run: flutter pub get --enforce-lockfile
      - name: Build Windows (debug)
        if: matrix.profile == 'debug'
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_OPT_LEVEL: "0"
          CARGOKIT_VERBOSE: "1"
        run: flutter build windows --debug
      - name: Build Windows (release)
        if: matrix.profile == 'release'
        run: flutter build windows --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.profile == 'release' && github.event_name != 'pull_request'
        with:
          name: parfait-windows-x64
          path: build/windows/x64/runner/Release
