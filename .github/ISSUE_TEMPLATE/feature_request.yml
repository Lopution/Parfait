name: 功能建议 Feature request
description: 想要新功能，或希望改进现有功能
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索现有 Issue，看看是否已经有人提过。
  - type: textarea
    id: feature
    attributes:
      label: 想要的功能 Feature
      description: 希望应用能做什么。
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景 Use case
      description: 什么情况下会用到它，现在遇到了什么不便。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代做法 Alternatives
      description: 现在是怎么绕过的，或者其他客户端是怎么做的。
