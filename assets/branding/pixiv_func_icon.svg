<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Pixiv Func icon</title>
  <desc id="desc">A pink folded ribbon forming the letter P on a white rounded tile.</desc>

  <defs>
    <!-- The same Func pink family, with a soft highlight at the fold. -->
    <linearGradient id="ribbon" x1="292" y1="238" x2="785" y2="895" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9CC0"/>
      <stop offset="0.48" stop-color="#FF6D9C"/>
      <stop offset="1" stop-color="#F43878"/>
    </linearGradient>
    <linearGradient id="fold" x1="328" y1="420" x2="545" y2="835" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC3D8" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#FF5E92" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0.25" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#FFF8FB"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </radialGradient>
  </defs>

  <!-- Transparent corners keep the asset compatible with platform masking. -->
  <rect x="44" y="44" width="936" height="936" rx="246" fill="url(#tileGlow)"/>
  <rect x="44" y="44" width="936" height="936" rx="246" fill="none" stroke="#F8EAF0" stroke-width="4"/>

  <!-- One continuous folded ribbon. The counter is cut out with the even-odd rule. -->
  <path fill="url(#ribbon)" fill-rule="evenodd" d="
    M322 466
    L494 278
    Q512 262 538 262
    H684
    C826 262 916 354 916 500
    C916 646 826 738 684 738
    H650
    L516 870
    V826
    Q516 862 486 881
    L354 958
    Q330 972 314 957
    Q298 943 298 918
    V524
    Q298 488 322 466
    Z

    M516 384
    H676
    C756 384 798 430 798 500
    C798 570 756 616 676 616
    H650
    L516 748
    Z"/>

  <!-- A quiet highlight makes the diagonal read as a fold, not a separate glyph. -->
  <path d="M322 466L494 278Q512 262 538 262H558L408 400Q388 418 388 446V937L354 958Q330 972 314 957Q298 943 298 918V524Q298 488 322 466Z"
    fill="url(#fold)"/>

  <!-- Keep the inner edge crisp after the highlight overlay. -->
  <path d="M516 384H676C756 384 798 430 798 500C798 570 756 616 676 616H650L516 748Z"
    fill="#FFFFFF" fill-opacity="0.96"/>
</svg>
