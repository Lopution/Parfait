# Global test timeouts.
#
# The full suite runs ~600 tests in well under a minute when nothing is
# blocked. A generous-but-bounded per-test timeout turns an environment
# flake (e.g. the real-socket smoke tests when the host network is
# degraded) into a fast, clearly labelled failure instead of a silent
# multi-minute hang.
timeout: 60s

tags:
  # UX review harness (test/review): scenes render the real app at device
  # size and films capture it frame by frame. The files do not end in
  # _test.dart, so a bare `flutter test` never runs them; tool/review.sh
  # does.
  review:
    timeout: 10x
