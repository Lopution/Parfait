name: pixiv_func

description: Pixiv Func 的现代化复刻项目

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.0
  flutter: '>=3.47.0'

dependencies:
  archive: ^4.2.0
  cached_network_image: ^4.0.0
  crypto: ^3.0.0
  cupertino_ui: ^1.0.2
  easy_refresh: ^3.5.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.2
  flutter_inappwebview: ^6.1.5
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^11.0.0
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^18.0.1
  http: ^1.2.0
  http_parser: ^4.0.2
  image: ^4.3.0
  intl: ^0.20.2
  material_ui: ^1.2.0
  meta: ^1.16.0
  path: ^1.9.1
  path_provider: ^2.1.5
  rhttp:
    path: plugins/rhttp/rhttp
  shared_preferences: ^2.5.0
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.3.5
  url_launcher: ^6.3.2
  visibility_detector: ^0.4.0
  webview_flutter: ^4.13.0
dependency_overrides:
  # Vendored fork: upstream 1.1.3 uses getDefaultProguardFile(
  # 'proguard-android.txt'), removed in AGP 9 — the only change is the
  # '-optimize' filename. Drop once flutter_inappwebview_android ≥1.2 lands
  # stable (fix already merged upstream in the 6.2.0-beta line).
  flutter_inappwebview_android:
    path: plugins/flutter_inappwebview_android

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  network_image_mock: ^2.1.1
  shared_preferences_platform_interface: ^2.4.0
  webview_flutter_platform_interface: ^2.15.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/emojis/
    - assets/stamps/

  fonts:
    - family: iconFont
      fonts:
        - asset: assets/icon.ttf
