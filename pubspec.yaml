name: parfait

description: Parfait：第三方 pixiv 客户端

publish_to: 'none'

# Single source of truth for releases: versionName X.Y.Z, versionCode +N
# (release.yml reads both; bump N on every release).
version: 0.10.0+2

environment:
  sdk: ^3.11.0
  flutter: '>=3.47.0'

dependencies:
  archive: ^4.2.0
  charset: ^2.0.1
  clock: ^1.1.2
  connectivity_plus: ^7.3.1
  crypto: ^3.0.0
  cupertino_ui: ^1.0.2
  dynamic_color: ^2.1.0
  # Fork: EasyRefresh depends on no MediaQuery; its indicator views read
  # only the padding. A keyboard animation or a system bar toggle no longer
  # rebuilds every feed's refresh and walks its list after the frame. A
  # profile tab's closing refresh header no longer moves the outer scroll
  # without a layout, which jumped the profile header on the next drag.
  # Back to ^4.0.x once xuelongqy/flutter_easy_refresh releases both.
  easy_refresh:
    git:
      url: https://github.com/Lopution/flutter_easy_refresh.git
      ref: d0a95b97cbcf4c0924980dc50b65ada65a7e60f7
      path: packages/easy_refresh
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_displaymode: ^0.7.0
  flutter_inappwebview: ^6.1.5
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^11.0.0
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^18.0.1
  html: ^0.15.0
  http: ^1.2.0
  http_parser: ^4.0.2
  image: ^4.3.0
  intl: ^0.20.2
  material_color_utilities: ^0.13.0
  material_ui: ^1.5.0
  meta: ^1.16.0
  octo_image: ^2.1.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  rhttp:
    path: plugins/rhttp/rhttp
  share_plus: ^13.3.0
  shared_preferences: ^2.5.0
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.3.5
  url_launcher: ^6.3.2
  visibility_detector: ^0.4.0
dependency_overrides:
  # Vendored fork: an AGP 9 build fix and the reverse-image file chooser
  # slot. plugins/flutter_inappwebview_android/UPSTREAM.md lists every
  # difference and when the fork can go.
  flutter_inappwebview_android:
    path: plugins/flutter_inappwebview_android

dev_dependencies:
  fake_async: ^1.3.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  network_image_mock: ^2.1.1
  shared_preferences_platform_interface: ^2.4.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/emojis/

  fonts:
    - family: iconFont
      fonts:
        - asset: assets/icon.ttf
