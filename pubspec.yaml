name: pixiv_func

description: Pixiv Func 的现代化复刻项目

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  shared_preferences: ^2.5.0
  flutter_secure_storage: ^10.0.0
  cached_network_image: ^3.4.0
  webview_flutter: ^4.13.0
  crypto: ^3.0.0
  http: ^1.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.0
  webview_flutter_platform_interface: ^2.15.0

flutter:
  uses-material-design: true

  fonts:
    - family: iconFont
      fonts:
        - asset: assets/icon.ttf
