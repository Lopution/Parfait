org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9+ enables the new DSL by default, but Flutter 3.47.9's flutter-gradle-plugin still casts
# the android extension to com.android.build.gradle.AbstractAppExtension (and upstream pub
# plugins flutter_displaymode / sqflite_android also rely on the legacy DSL). Keep false until
# Flutter's Gradle plugin migrates to the new AGP Variant/ApplicationExtension API.
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=true
